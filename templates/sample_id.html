<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>elabFTW Sample Tracking</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #007BFF;
      color: white;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      margin-top: 70px;
      background: rgba(0, 0, 0, 0.45);
      padding: 30px;
      border-radius: 15px;
      width: 500px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input[type="text"],
    input[type="password"] {
      width: calc(100% - 22px);
      padding: 11px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
    }

    .block {
      margin: 18px 0;
    }

    .radio-group {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    label {
      cursor: pointer;
    }

    input[type="submit"] {
      width: 100%;
      background: #65c7f7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 18px;
    }

    input[type="submit"]:hover {
      background: #ff7eb3;
    }

    .hint {
      font-size: 13px;
      color: #e5e7eb;
      margin-top: 6px;
      line-height: 1.4;
    }

    .footer-credit {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.25);
      font-size: 13px;
      color: #e5e7eb;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>elabFTW Sample Tracking</h1>

    <form action="/process_input" method="post">
      <input
        type="text"
        name="query"
        placeholder="Enter Sample ID or contributor name, e.g. MB1-0311 or Margarida Barroso"
        required
      >

      <input
        type="password"
        name="api_key"
        placeholder="Enter your eLabFTW API key"
        required
      >

      <div class="block">
        <strong>Search mode</strong>
        <div class="radio-group">
          <label>
            <input type="radio" name="search_mode" value="sample" checked>
            Search by Sample ID
          </label>
          <label>
            <input type="radio" name="search_mode" value="person">
            Search by contributor
          </label>
        </div>
      </div>

      <div class="block">
        <strong>Graph layout</strong>
        <div class="radio-group">
          <label>
            <input type="radio" name="graph_center" value="sample" checked>
            Sample view
          </label>
          <label>
            <input type="radio" name="graph_center" value="person">
            Contributor view
          </label>
        </div>
        <div class="hint">
          Choose the layout depending on whether you want to explore the history of a sample or the records associated with a contributor.
        </div>
      </div>

      <div class="block">
        <strong>Data source</strong>
        <div class="radio-group">
          <label>
            <input type="radio" name="data_type" value="item">
            Items
          </label>
          <label>
            <input type="radio" name="data_type" value="experiment" checked>
            Experiments
          </label>
        </div>
      </div>

      <div class="block">
        <label>
          <input type="checkbox" name="full_text_match">
          Enable full-text matching
        </label>
      </div>

      <div class="block">
        <label>
          <input type="checkbox" name="generate_summary">
          Save search result as a new eLabFTW item
        </label>
      </div>

      <input type="submit" value="Generate Graph">
    </form>

    <div class="footer-credit">
      Powered by the FLAIR project<br>
      Main contributors: Hao Wang, Olaf Lindemann, Hongbin Zhang
    </div>
  </div>
</body>
</html>
